# Publishes a release when a v* tag is pushed.
#
# The point of this workflow is that a published binary is a verifiable, automated build of
# the source in this repository — not something compiled on a maintainer's machine and
# uploaded by hand, which is exactly how the 8.0.0 source came to be lost.
#
# To cut a release: bump `Version` in main.go, commit, then create the tag (for example
# v8.0.1) on GitHub. Everything below happens on its own. The first step deliberately fails
# if the tag and the version constant disagree, so a mislabelled release cannot ship.
name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish, e.g. v8.0.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Work out the version, and refuse to ship a mislabelled one
        id: ver
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VER="${TAG#v}"
          SRC_VER="$(grep -oP 'const Version = "\K[^"]+' main.go)"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$TAG_VER"  >> "$GITHUB_OUTPUT"
          if [ "$TAG_VER" != "$SRC_VER" ]; then
            echo "FAIL: tag $TAG says $TAG_VER but main.go says $SRC_VER."
            echo "Bump the Version constant and re-tag, rather than shipping a build that"
            echo "reports the wrong version in its own About box and update check."
            exit 1
          fi
          echo "OK: tag and main.go both say $SRC_VER"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # go-webview2 is Windows-only, so on a Linux agent the package compiles to an empty
      # stub and vet reports every call into it as undefined. Vet for the target we ship.
      - name: Vet
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go vet ./...

      # Cross-compiled from Linux on purpose: no cgo, so the Windows binary is reproducible
      # from any agent and the build cannot quietly depend on a developer's machine.
      - name: Build (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-H windowsgui -s -w" -o "Ultimate Settings Panel.exe" .

      # The panel is embedded, so a build that succeeds but ships a broken page is possible.
      # These checks fail the release if the two promises in the README stop being true:
      # nothing runs at startup, and the update check points at GitHub.
      - name: Check the shipped promises still hold
        run: |
          set -e
          if grep -qa "doUpdateCheck(false)" "Ultimate Settings Panel.exe"; then
            echo "FAIL: an update check runs at startup"; exit 1
          fi
          if ! grep -qa "api.github.com/repos/%s/%s/releases/latest" "Ultimate Settings Panel.exe"; then
            echo "FAIL: the GitHub releases endpoint is missing"; exit 1
          fi
          if ! grep -qa "uspCheckUpdate" "Ultimate Settings Panel.exe"; then
            echo "FAIL: the update bridge is missing"; exit 1
          fi
          echo "OK: no startup call, update check present"

      # The archive layout has to match 8.0.0's, because the winget manifest addresses the
      # executable by its relative path inside the zip. Changing where it sits, or what it
      # is called, breaks `winget install` for everyone.
      - name: Assemble the archive
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "Ultimate Settings Panel.exe" dist/
          cp "Instructions/How to use READ ME.txt" "dist/How to use  READ ME.txt"
          printf '[{000214A0-0000-0000-C000-000000000046}]\r\nProp3=19,11\r\n[InternetShortcut]\r\nIDList=\r\nURL=https://techygeekshome.info/ultimate-settings-panel-online/\r\n' \
            > "dist/Ultimate Settings Panel - Online Version.url"
          cd dist
          zip -X -r ../Ultimate-Settings-Panel.zip .
          cd ..
          unzip -l Ultimate-Settings-Panel.zip
          # The manifest's RelativeFilePath assumes the exe is at the root of the archive.
          unzip -l Ultimate-Settings-Panel.zip | grep -q " Ultimate Settings Panel.exe$" \
            || { echo "FAIL: the executable is not at the root of the archive"; exit 1; }

      - name: Checksums
        run: |
          sha256sum "Ultimate-Settings-Panel.zip" "Ultimate Settings Panel.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Ultimate Settings Panel ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            Ultimate-Settings-Panel.zip
            Ultimate Settings Panel.exe
            SHA256SUMS.txt
