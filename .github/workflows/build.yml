# Builds Ultimate Settings Panel on every push and pull request.
#
# Together with the release workflow this is what makes a published binary a verifiable,
# automated build of the source in this repository, rather than something a maintainer
# compiled on their own machine and uploaded — which is exactly how the 8.0.0 source came
# to be lost in the first place.
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # go-webview2 is Windows-only, so on a Linux agent the package compiles to an empty
      # stub and vet reports every call into it as undefined. Vet for the target we ship.
      - name: Vet
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go vet ./...

      # Windows takes an executable's icon and its Properties -> Details panel from a
      # resource section, not from anything in the Go source. goversioninfo compiles
      # Branding/usp.ico and versioninfo.json into resource.syso; the Go linker picks up
      # any .syso sitting next to the package automatically. No GOOS here on purpose --
      # the tool itself has to build for the runner, not for the target.
      - name: Embed the icon and version resource
        run: |
          set -euo pipefail
          SRC_VER="$(grep -oP 'const Version = "\K[^"]+' main.go)"
          IFS=. read -r MAJ MIN PAT <<< "$SRC_VER"
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.1 \
            -64 -icon=Branding/usp.ico -o resource.syso \
            -file-version="$SRC_VER.0" -product-version="$SRC_VER.0" \
            -ver-major="$MAJ" -ver-minor="$MIN" -ver-patch="${PAT:-0}" -ver-build=0 \
            -product-ver-major="$MAJ" -product-ver-minor="$MIN" -product-ver-patch="${PAT:-0}" -product-ver-build=0 \
            versioninfo.json
          ls -l resource.syso

      # Cross-compiled from Linux on purpose: no cgo, so the Windows binary is
      # reproducible from any agent and the build cannot quietly depend on a
      # developer's machine.
      - name: Build (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-H windowsgui -s -w" -o "Ultimate Settings Panel.exe" .

      # The panel is embedded, so a build that succeeds but ships a broken page is
      # possible. These checks fail the build if the two promises in the README stop
      # being true: nothing runs at startup, and the update check points at GitHub.
      - name: Check the shipped promises still hold
        run: |
          set -e
          if grep -qa "doUpdateCheck(false)" "Ultimate Settings Panel.exe"; then
            echo "FAIL: an update check runs at startup"; exit 1
          fi
          if ! grep -qa "api.github.com/repos/%s/%s/releases/latest" "Ultimate Settings Panel.exe"; then
            echo "FAIL: the GitHub releases endpoint is missing"; exit 1
          fi
          if ! grep -qa "uspCheckUpdate" "Ultimate Settings Panel.exe"; then
            echo "FAIL: the update bridge is missing"; exit 1
          fi
          echo "OK: no startup call, update check present"

      # A missing or ignored .syso fails silently -- the build succeeds and ships an
      # executable with the stock Go icon and a blank Properties panel. Read the strings
      # back out of the binary instead of trusting that the step above ran.
      - name: Check the icon and version resource made it into the binary
        run: |
          python3 - <<'PY'
          data = open("Ultimate Settings Panel.exe", "rb").read()
          for s in ("TechyGeeksHome", "Ultimate Settings Panel"):
              if s.encode("utf-16-le") not in data:
                  raise SystemExit(f"FAIL: {s!r} is missing from the version resource")
          print("OK: version resource embedded")
          PY

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-settings-panel
          path: Ultimate Settings Panel.exe
          retention-days: 14
